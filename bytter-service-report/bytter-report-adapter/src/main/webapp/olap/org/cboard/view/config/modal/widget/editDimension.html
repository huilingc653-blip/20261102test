<div class="modal-header">
    <button type="button" class="close" data-dismiss="modal" aria-label="Close" ng-click="close()">
        <span aria-hidden="true">×</span></button>
    <h4 class="modal-title">{{dimension.level?'['+dimension.level+'].':''}}{{dimension.alias?dimension.alias:dimension.col}}</h4>
</div>
<div class="modal-body">
    <div class="row">
        <div class="col-md-12 form-horizontal">

            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label class="col-sm-2 control-label">{{'CONFIG.WIDGET.FORMATTER'|translate}}</label>
                        <div class="col-sm-10">
                            <select class="form-control" ng-model="formatterType">
                                <option value="">无格式化</option>
                                <option ng-repeat="item in dataFormatterSelects" value="{{item.formatterType}}">
                                    {{item.formatterTypeDes}}
                                </option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label class="col-sm-2 control-label">格式化说明</label>
                        <div class="col-sm-10">

                            <table class="table table-bordered table-condensed">
                                <thead>
                                <tr>
                                    <td ng-repeat="title in moneyDataFormatterTemplate.headerTitles">
                                        {{title}}
                                    </td>
                                </tr>
                                </thead>
                                <tbody>
                                <tr ng-repeat="formatterItem in moneyDataFormatterTemplate.data">
                                    <td>{{formatterItem.formatterTypeDes}}</td>
                                    <td>{{formatterItem.demoValue}}</td>
                                    <td>{{formatterItem.demoShowResult}}</td>
                                    <td>{{formatterItem.remark}}</td>
                                </tr>
                                </tbody>
                            </table>

                            <p style="color: grey;" class="text-success">
                                操作提示：请根据维度的值类型进行格式化操作，若数据类型与格式化操作所要求类型不一致，则数据的显示可能会不正常。
                            </p>
                        </div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-12">
                    <div class="form-group">
                        <label class="col-sm-2 control-label"></label>
                        <div class="col-sm-10">

                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>
<div class="modal-footer">
    <button type="button" class="btn btn-primary" ng-click="ok()">{{'COMMON.OK'|translate}}</button>
</div>
