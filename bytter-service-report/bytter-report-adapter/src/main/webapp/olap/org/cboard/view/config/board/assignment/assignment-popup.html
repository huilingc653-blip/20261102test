
<div class="modal-dialog modal-lg" style="width: 1000px;">
    <div class="modal-content">
        <div class="modal-header">
            <button type="button" class="close" data-dismiss="modal" aria-label="Close" ng-click="close()">
                <span aria-hidden="true">×</span></button>
            <h4 class="modal-title">用户权限分配</h4>
        </div>
        <div class="modal-body">
            <div class="row row-no-gutter user-choose-type-container">
                <div class="col-xs-6">
                    <div class="user-choose-type" ng-click="assignment.userChooseType = 1"
                         ng-class="{'user-choose-type-selected':assignment.userChooseType==1,'user-chooose-type-obs':assignment.userChooseType&&assignment.userChooseType==2}">
                        按用户 <span ng-if="passObj.userNumber">已选{{passObj.userNumber}}人</span>
                    </div>
                </div>
                <div class="col-xs-6">
                    <div class="user-choose-type" ng-click="assignment.userChooseType = 2"
                         ng-class="{'user-choose-type-selected':assignment.userChooseType==2,'user-chooose-type-obs':assignment.userChooseType&&assignment.userChooseType==1}">
                        按角色 <span ng-if="passObj.roleUserNumber">已选{{passObj.roleUserNumber}}人</span>
                    </div>
                </div>
            </div>


            <div class="row row-no-gutter assign-candidate">
                <div ng-if="assignment.userChooseType==0 || assignment.userChooseType==1" style="height: 500px;">
                    <div class="col-xs-4" style="height:100%;border-right: 1px dashed #b9b9b9;">
                        <h4>网点、单位</h4>
                        <hr style="margin:5px 0;">
<!--                        <div class="ztree" style="overflow: auto;height:430px;">-->
<!--                            <Corp-Select-Tree ></Corp-Select-Tree>-->
<!--                        </div>-->

                        <div corp-select-tree="corpSelectTree" class="ztree" style="overflow: auto;height:430px;"></div>

                    </div>
                    <div class="col-xs-4" style="height:100%;border-right: 1px dashed #b9b9b9;">
                        <h4>备选用户</h4>
                        <hr style="margin:5px 0;">
                        <div ng-show="users && users.length>0" class="list-group" style="height:430px;overflow: auto;">
                            <div class="list-group-item" ng-repeat="user in users"
                                 ng-class="{'list-group-item-success':checkUserSelected(user)}">
                                <a href="javascript:void(0);" ng-click="addCandidateUserValue($index,user)"
                                   style="color:#555">
                                    <div class="select-user-name">{{user.username}}
                                        <small>({{user.loginName}})</small>
                                    </div>
                                    <div class="select-user-text">{{user.corpName}}</div>
                                    <span ng-show="!checkUserSelected(user)"
                                          class="pull-right glyphicon glyphicon-plus select-user-op-icon"
                                          aria-hidden="true"></span>
                                    <span ng-show="checkUserSelected(user)"
                                          class="pull-right glyphicon glyphicon-remove select-user-op-icon"
                                          aria-hidden="true"></span>
                                </a>
                                <span class="pull-right glyphicon glyphicon-eye-open watch-op-icon"
                                      ng-click="watchAction(user)" title="查看角色" aria-hidden="true"></span>
                            </div>
                        </div>
                        <div ng-show="!users || users.length==0" class="alert" role="alert">请选择左侧单位</div>
                    </div>
                    <div class="col-xs-4" style="height:100%;">
                        <h4>已选用户</h4>
                        <hr style="margin:5px 0;">
                        <div class="list-group" style="height:430px;overflow: auto;">
                            <div class="list-group-item"
                                 ng-repeat="candidateUser in assignment.candidateUsers track by $index">
                                <a href="javascript:void(0);" ng-click="removeCandidateUserValue($index,candidateUser)">
                                    <div class="select-user-name">{{candidateUser.name}}
                                        <small>({{candidateUser.loginName}})</small>
                                    </div>
                                    <div class="select-user-text">{{candidateUser.corpName}}</div>
                                    <span class="pull-right glyphicon glyphicon-remove select-user-op-icon"
                                          aria-hidden="true"></span>
                                </a>
                                <span class="pull-right glyphicon glyphicon-eye-open watch-op-icon"
                                      ng-click="watchAction(candidateUser)" title="查看角色" aria-hidden="true"></span>
                            </div>
                        </div>
                    </div>
                </div>
                <!--角色选择-->
                <div ng-if="assignment.userChooseType==2" style="height: 500px;">
                    <div class="col-xs-3" ng-repeat="col in rolesCols">
                        <div class="list-group">
                            <div class="list-group-item"
                                 ng-class="{'list-group-item-success':checkRoleSelected(role)}"
                                 ng-repeat="role in roles"
                                 ng-if="$index%4==col">
                                <a href="javascript:void(0);" ng-click="addCandidateGroupValue($index,role)">
                                    <div>
                                        {{role.name}}
                                        <span ng-show="!checkRoleSelected(role)"
                                              class="pull-right glyphicon glyphicon-plus select-role-op-icon"
                                              aria-hidden="true"></span>
                                        <span ng-show="checkRoleSelected(role)"
                                              class="pull-right glyphicon glyphicon-remove select-role-op-icon"
                                              aria-hidden="true"></span>
                                    </div>
                                </a>
                                <span class="pull-right glyphicon glyphicon-eye-open watch-op-icon-role"
                                      ng-click="watchAction(role)" title="查看用户" aria-hidden="true"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button type="button" class="btn btn-primary" ng-click="close()">{{'COMMON.CANCEL'|translate}}</button>
            <button type="button" class="btn btn-primary" ng-click="ok()">{{'COMMON.OK'|translate}}</button>
        </div>
    </div>
</div>

<style>

    .select-user-name{
        font-size: 14px;
        font-weight: bold;
    }
    .select-user-text{
        font-size: 12px;
        color:#b5b5b5;
    }
    .select-user-op-icon{
        position: absolute;
        right: 10px;
        top: 17px;
    }
    .watch-op-icon{
        position: absolute;
        right: 30px;
        top: 7px;
        padding: 10px;
    }
    .watch-op-icon-role{
        position: absolute;
        right: 30px;
        top: 7px;
        padding-right: 10px;
    }
    .watch-op-icon:hover,.watch-op-icon-role:hover{
        cursor: pointer;
    }
    .assign-candidate .list-group-item{
        padding:5px 10px;
    }
    .assign-candidate .list-group-item a{
        color:#555;
        text-decoration: none;
    }


    .select-role-op-icon{
        position: absolute;
        right: 10px;
        top: 8px;
    }
    .user-choose-type-container{
        margin-bottom: 15px;
    }
    .user-choose-type{
        border: 2px dashed #ddd;
        text-align: center;
        padding: 5px;
        font-size: 16px;
        font-weight: bold;
    }
    .choose-pass{
        border: 2px dashed #36a7c4;
        text-align: center;
        padding: 5px;
        font-size: 16px;
        font-weight: bold;
        color: #36a7c4;
    }
    .user-choose-type-selected{
        border: 2px dashed #36a7c4;
        color:#36a7c4;
    }
    .user-choose-type-selected:hover{
        cursor:pointer;
    }
    .user-chooose-type-obs{
        color: #36a7c4;
    }
    .user-choose-type:hover{
        background: #f5f5f5;
        cursor:pointer;
    }

</style>
