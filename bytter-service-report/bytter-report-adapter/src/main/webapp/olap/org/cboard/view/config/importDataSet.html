<section class="content-header">
    <h1>
        <i class="fa fa-file"></i>
        {{'COMMON.IMPORT_DATASET'|translate}}
    </h1>
</section>
<!-- Content Wrapper. Contains page content -->
<div id="inner-container" class="content">

    <div class="row">

        <div class="col-md-12">
            <div class="box">

                <div class="box-header with-border">
                    <h3 class="box-title"></h3>
                    <!--<h3 class="box-title">{{curDataset.name}}</h3>-->
                    <!--<div class="box-tools pull-right">-->
                    <!--<span class="label label-danger">{{'COMMON.IMPORT_DATASET'|translate}}</span>-->
                    <!--</div>-->
                </div>

                <div class="box-body">
                    <div class="row">

                        <div class="col-md-12 form-horizontal">

                            <div class="row">
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <label class="col-sm-2 control-label">{{'COMMON.UPLOAD_FILE'|translate}}</label>
                                        <div class="col-sm-10">
                                            <input type="file"
                                                   ng-disabled="resolveDataSetFlag"
                                                   id="uploadDataSetFileElement"
                                                   class="form-control"
                                            />
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row" ng-show="resolveDataSetFlag">
                                <div class="col-md-12">
                                    <div class="form-group"
                                         ng-class="{'has-error': !(verify.dsName || curDataset.name.length)}">
                                        <label class="col-sm-2 control-label">{{'CONFIG.DATASET.NAME'|translate}}</label>
                                        <div class="col-sm-10">
                                            <input id="DatasetName"
                                                   ng-model="curDataset.name"
                                                   maxlength="100"
                                                   class="form-control"
                                                   placeholder="{{'CONFIG.DATASET.CATEGORY'|translate}}/{{'CONFIG.DATASET.NAME'|translate}}"/>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-12">
                                    <div class="form-group">
                                        <label class="col-sm-2 control-label"></label>
                                        <div class="col-sm-10">
                                            <p>注意事项：</p>
                                            <p>1. 数据集文件后缀名为btcrds。如果文件后缀名不对，将不能上传文件。</p>
                                            <p>2. 数据集文件解析成功后方可进行保存操作。</p>
                                            <p>3. 如果数据集文件已经成功导入系统并保存，则不支持再次导入该数据集。</p>
                                            <p>4. 点击重置后，方可重新选择上传的文件。</p>
                                        </div>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </div>



                </div>
                <!-- /.box-body -->
                <div class="box-footer text-center">
                    <button type="submit" ng-click="reset()" class="btn btn-danger pull-right">
                        {{'COMMON.RESET'|translate}}
                    </button>
                    <button type="submit" ng-disabled="!resolveDataSetFlag" ng-click="save()"
                            class="btn btn-success pull-right"
                            style="margin-right: 5px">{{'COMMON.SAVE'|translate}}
                    </button>
                </div>
                <!-- /.box-footer-->
                <div class="overlay" ng-show="loading">
                    <i class="fa fa-spinner fa-spin"></i>
                </div>
            </div>
        </div>
    </div>
</div>
