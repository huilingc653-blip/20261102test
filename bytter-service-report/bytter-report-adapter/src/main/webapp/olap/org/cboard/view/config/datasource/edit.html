<div class="form-group" ng-repeat="alert in alerts">
    <div uib-alert ng-class="'alert-' + (alert.type || 'warning')"
         close="alerts.splice($index, 1)">{{alert.msg}}
    </div>
</div>
<div class="form-group">
    <label>{{'CONFIG.DATA_SOURCE.DATA_PROVIDER'|translate}}</label>
    <input ng-model="curDatasource.type" class="form-control input-sm" disabled>
</div>
<div class="form-group">
    <label>{{'CONFIG.DATA_SOURCE.NAME'|translate}}</label>
    <input id="DataSetName" ng-model="curDatasource.name" class="form-control input-sm"/>
</div>
<div>
    <div class="form-group">
        <label>{{'DATAPROVIDER.JDBC.DRIVER'|translate}} *</label>
        <input ng-model="curDatasource.config.driver" class="form-control input-sm" placeholder="" />
    </div>
    <div class="form-group">
        <label>{{'DATAPROVIDER.JDBC.JDBCURL'|translate}} *</label>
        <input ng-model="curDatasource.config.jdbcurl" class="form-control input-sm" placeholder="" />
    </div>
    <div class="form-group">
        <label>{{'DATAPROVIDER.JDBC.USERNAME'|translate}} *</label>
        <input ng-model="curDatasource.config.username" class="form-control input-sm" placeholder="" />
    </div>
    <div class="form-group">
        <label>{{'DATAPROVIDER.JDBC.PASSWORD'|translate}}</label>
        <input ng-model="curDatasource.config.password" class="form-control input-sm" type="password" placeholder="" />
    </div>
    <div class="form-group">
        <label>{{'DATAPROVIDER.POOLEDCONNECTION'|translate}}</label>
        <input ng-model="curDatasource.config.pooled" type="checkbox"/>
    </div>
    <div class="form-group">
        <label>{{'DATAPROVIDER.AGGREGATABLE_PROVIDER'|translate}}</label>
        <input ng-model="curDatasource.config.aggregateProvider" type="checkbox"/>
    </div>

</div>
<div class="form-group">
    <button type="submit" class="btn btn-danger pull-right">{{'COMMON.CANCEL'|translate}}</button>
    <button type="submit" ng-click="saveEdit()" class="btn btn-success pull-right" style="margin-right: 5px">{{'COMMON.SAVE'|translate}}</button>
    <button type="submit" ng-click="test()" class="btn btn-success pull-right" style="margin-right: 5px">{{'CONFIG.DATA_SOURCE.TEST'|translate}}</button>
</div>
