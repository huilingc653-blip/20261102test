<!DOCTYPE HTML>
<html>
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="maximum-scale=1.0,minimum-scale=1.0,user-scalable=0,width=device-width,initial-scale=1.0"/>
		<meta name="format-detection" content="telephone=no,email=no,date=no,address=no">
		<title></title>
		<style type="text/css">
			* {
				margin: 0;
				padding: 0;
				border: 0;
				outline: 0;
				background: rgba(0,0,0,0);
			}
			html, body {
				background: rgba(0,0,0,0);
			}
			body {
				display: -webkit-box;
				-webkit-box-orient: horizontal;
				-webkit-box-pack: center;
				-webkit-box-align: center;
				display: box;
				box-orient: horizontal;
				box-pack: center;
				box-align: center;
				position: absolute;
				top: 0;
				left: 0;
				width: 100%;
				height: 100%;
			}
			.sk-cube-grid {
				width: 50px;
				height: 50px;
				margin: 50px auto;
			}
			.sk-cube-grid .sk-cube {
				width: 33.33%;
				height: 33.33%;
				background-color:#2196F3;
				color:#fff;
				text-align: center;
				font-size: 0.2em;
				/*line-height: 0.2em;*/
				float: left;
				-webkit-animation: sk-cubeGridScaleDelay 1.3s infinite ease-in-out;
				animation: sk-cubeGridScaleDelay 1.3s infinite ease-in-out;
			}
			.sk-cube-grid .sk-cube1 {
				-webkit-animation-delay: 0.2s;
				animation-delay: 0.2s;
			}
			.sk-cube-grid .sk-cube2 {
				-webkit-animation-delay: 0.3s;
				animation-delay: 0.3s;
			}
			.sk-cube-grid .sk-cube3 {
				-webkit-animation-delay: 0.4s;
				animation-delay: 0.4s;
			}
			.sk-cube-grid .sk-cube4 {
				-webkit-animation-delay: 0.1s;
				animation-delay: 0.1s;
			}
			.sk-cube-grid .sk-cube5 {
				-webkit-animation-delay: 0.2s;
				animation-delay: 0.2s;
			}
			.sk-cube-grid .sk-cube6 {
				-webkit-animation-delay: 0.3s;
				animation-delay: 0.3s;
			}
			.sk-cube-grid .sk-cube7 {
				-webkit-animation-delay: 0.0s;
				animation-delay: 0.0s;
			}
			.sk-cube-grid .sk-cube8 {
				-webkit-animation-delay: 0.1s;
				animation-delay: 0.1s;
			}
			.sk-cube-grid .sk-cube9 {
				-webkit-animation-delay: 0.2s;
				animation-delay: 0.2s;
			}
			@-webkit-keyframes sk-cubeGridScaleDelay {
			0%, 70%, 100% {
			-webkit-transform: scale3D(1, 1, 1);
			transform: scale3D(1, 1, 1); }
			35% {
			-webkit-transform: scale3D(0, 0, 1);
			transform: scale3D(0, 0, 1); } }
			@keyframes sk-cubeGridScaleDelay {
			0%, 70%, 100% {
			-webkit-transform: scale3D(1, 1, 1);
			transform: scale3D(1, 1, 1); }
			35% {
			-webkit-transform: scale3D(0, 0, 1);
			transform: scale3D(0, 0, 1); } }
		</style>
	</head>
	<body>
		<div class="sk-cube-grid">
			<div class="sk-cube sk-cube1">B</div>
			<div class="sk-cube sk-cube2">Y</div>
			<div class="sk-cube sk-cube3">T</div>
			<div class="sk-cube sk-cube4">T</div>
			<div class="sk-cube sk-cube5">E</div>
			<div class="sk-cube sk-cube6">R</div>
			<div class="sk-cube sk-cube7">拜</div>
			<div class="sk-cube sk-cube8"></div>
			<div class="sk-cube sk-cube9">特</div>
			<!--<span style="color: white;/* float: left; */position: absolute;top: 90%;margin-top: -50px;/* z-index: 1; */left: 23%;">拜</span>-->
		</div>
	</body>
</html>
