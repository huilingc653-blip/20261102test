
dubbo:
  consumer:
    check: false
    filter: tracing
  provider:
    filter: tracing
  scan:
    base-packages: com.bytter.system.service.impl,com.bytter.*.service.impl,com.bytter.biz.pool.service.impl,com.bytter.system.inneraccount.service.impl,com.bytter.system.service

spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  cloud:
    stream:
      bindings:
        init-net-day-close-out-0:
          destination: system-initNetDayClose-exchange
          group: queue-1
          contentType: application/json
      rabbit:
        bindings:
          init-net-day-close-out-0:
            producer:
              declare-exchange: true
              exchangeType: direct
              routing-key-expression: headers["InitNetDay"]