
dubbo:
  scan:
    base-packages: com.bytter.biz.budget.service.impl
  # 指定需要订阅的服务提供方，默认值*，会订阅所有服务，不建议使用
  cloud:
    subscribed-services: bytter-system
  provider:
    loadbalance: dev
  consumer:
    check: false
    # 屏蔽重试任务
    reconnect: false
    loadbalance: dev
  # 将消费者注册到nacos注册中心上
  registry:
    parameters:
      register-consumer-url: true
