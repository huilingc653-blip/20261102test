input.encoding=UTF-8
output.encoding=UTF-8
contentType=text/html;charset=UTF-8

resource.loader = class,file,string

file.resource.loader.description = Velocity File Resource Loader
file.resource.loader.class=org.apache.velocity.runtime.resource.loader.FileResourceLoader
file.resource.loader.path = /opt/templates
file.resource.loader.cache = false

class.resource.loader.description = Velocity Class Resource Loader
class.resource.loader.class =org.apache.velocity.runtime.resource.loader.ClasspathResourceLoader
class.resource.loader.cache = false

string.resource.loader.class = org.apache.velocity.runtime.resource.loader.StringResourceLoader
directive.evaluate.context.class = org.apache.velocity.VelocityContext

# 配置宏定义文件路径
velocimacro.library = /views/flow/flow.vm
velocimacro.library.autoreload = true
velocimacro.permissions.allow.inline = true
velocimacro.permissions.allow.inline.to.global = true
