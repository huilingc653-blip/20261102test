
# 关闭维护接口的 HTTP 暴露及网关路由管理，不影响业务网关转发。
management:
  endpoints:
    web:
      exposure:
        exclude: "*"
  endpoint:
    gateway:
      enabled: false

spring:
  aop:
    proxy-target-class: true
  main:
    allow-bean-definition-overriding: true
    web-application-type: reactive
  security:
    oauth2:
      jwt:
        signingKey: ${JWT_SIGNING_KEY:ByTtEr}
  cloud:
    loadbalancer:
      ribbon:
        enabled: false
dubbo:
  consumer:
    timeout: 10000
    check: false
  provider:
    timeout: 10000
  scan:
    base-packages: com.bytter
