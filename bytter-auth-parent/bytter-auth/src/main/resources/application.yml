
# 认证服务不对外提供维护接口。
management:
  endpoints:
    web:
      exposure:
        exclude: "*"

dubbo:
  consumer:
    timeout: 10000
    check: false
  provider:
    timeout: 10000
  scan:
    base-packages: com.bytter

spring:
  cloud:
    stream:
      bindings:
        tenantLogout-in-0:
          destination: management-auth-exchange
          content-type: application/json
          group: auth-tenant-logout
      rabbit:
        bindings:
          tenantLogout-in-0:
            consumer:
              exchangeType: direct
              bindingRoutingKey: tenantLogout
      function:
        definition: tenantLogout
