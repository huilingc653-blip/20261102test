spring:
  profiles:
    active: dev
  application:
    name: bytter-auth
  aop:
    proxy-target-class: true
  mvc:
    servlet:
      load-on-startup: 1
  security:
    oauth2:
      jwt:
        signingKey: ${JWT_SIGNING_KEY:ByTtEr}
      token:
        redis-enable: true

  main:
    allow-bean-definition-overriding: true

---
spring:
  profiles: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:192.168.0.111}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:bytter-micro-dev}
      config:
        prefix: ${spring.application.name}
        server-addr: ${NACOS_HOST:192.168.0.111}:${NACOS_PORT:8848}
        refresh-enabled: true
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:bytter-micro-dev}
        shared-configs: common.yml
---
