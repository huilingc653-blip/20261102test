spring:
  profiles:
    active: dev
  application:
    name: bytter-service-ras
  main:
    allow-bean-definition-overriding: true

---
spring:
  profiles: dev
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:192.168.0.111}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:bytter-micro-dev}
      config:
        prefix: ${spring.application.name}
        server-addr: ${NACOS_HOST:192.168.0.111}:${NACOS_PORT:8848}
        refresh-enabled: true
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:bytter-micro-dev}
        shared-configs: common.yml
---
spring:
  profiles: test
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:192.168.0.114}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:bytter-test}
      config:
        prefix: ${spring.application.name}
        server-addr: ${NACOS_HOST:192.168.0.114}:${NACOS_PORT:8848}
        refresh-enabled: true
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:bytter-test}
        shared-configs: common.yml
---
spring:
  profiles: prod
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_HOST:nacos-third-prod.dslbuy.com}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:cw-zijinzitong}
      config:
        prefix: ${spring.application.name}
        server-addr: ${NACOS_HOST:nacos-third-prod.dslbuy.com}:${NACOS_PORT:8848}
        file-extension: yml
        namespace: ${NACOS_NAMESPACE:cw-zijinzitong}
        shared-configs: common.yml