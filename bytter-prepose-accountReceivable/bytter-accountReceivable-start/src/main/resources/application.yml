

dubbo:
  scan:
    base-packages: com.bytter.accountReceivable.domain.*.service.impl
  # 指定需要订阅的服务提供方，默认值*，会订阅所有服务，不建议使用
  cloud:
    subscribed-services: bytter-system
    check: false
    # 屏蔽重试任务
    reconnect: false
    retries: 0
  consumer:
    check: false
  # 将消费者注册到nacos注册中心上
  registry:
    parameters:
      register-consumer-url: true
spring:
  cloud:
    stream:
      bindings:
        billEndorsementToPayment-in-0:
          destination: payment-billendorsement-exchange
          group: payment-billendorsement-group
          contentType: application/json
      rabbit:
        bindings:
          billEndorsementToPayment-in-0:
            consumer:
              exchangeType: direct
              bindingRoutingKey: billendorsement
              durableSubscription: true
      function:
        definition: billEndorsementToPayment;workflowEvent
